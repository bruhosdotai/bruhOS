# TonyPi (Raspberry Pi 5). Verify every action-group name against ActionGroups/ on your robot.

[body]
name = "tonypi"
sdk_path = "/home/pi/TonyPi/HiwonderSDK"
action_path = "/home/pi/TonyPi/ActionGroups"
turn_step_deg = 15.0

[actions]
stand = "stand"
forward = "go_forward"
turn_left = "turn_left"
turn_right = "turn_right"
kick_left = "left_shot"
kick_right = "right_shot"
wave = "wave"
stand_up_front = "stand_up_front"
stand_up_back = "stand_up_back"
# TonyPi has no gripper: grab / release stay unmapped and the skills report FAILED.

[camera]
enabled = true
device = 0
width = 640
height = 480
hfov_deg = 62.0

[imu]
enabled = true
bus = 1
address = "0x68"
fall_deg = 55.0
forward_sign = 1

[speech]
language = "en"
asr_model = "base.en"
tts_voice = "en-us"

[brain]
name = "rules"

[trace]
root = "traces"
sinks = ["local"]
