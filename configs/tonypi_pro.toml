# TonyPi Pro (Raspberry Pi 5, hands). Verify every action-group name against ActionGroups/ on your robot.

[body]
name = "tonypi_pro"
sdk_path = "/home/pi/TonyPi"
action_path = "/home/pi/TonyPi/ActionGroups"
turn_step_deg = 15.0

[actions]
stand = "stand"
forward = "go_forward"
turn_left = "turn_left"
turn_right = "turn_right"
grab = "hand_close"
release = "hand_open"
kick_left = "left_shot"
kick_right = "right_shot"
wave = "wave"
stand_up_front = "stand_up_front"
stand_up_back = "stand_up_back"

[camera]
enabled = true
device = 0
width = 640
height = 480
hfov_deg = 62.0

[imu]
enabled = true
bus = 1
address = "0x68"
fall_deg = 55.0
forward_sign = 1

[speech]
language = "en"
asr_model = "base.en"
tts_voice = "en-us"

[brain]
name = "qwen_vl"
base_url = "http://192.168.1.50:8000/v1"   # vLLM on a desktop GPU, not on the Pi
model = "Qwen/Qwen2.5-VL-7B-Instruct"

[trace]
root = "traces"
sinks = ["local"]
