# TonyPi Pro (Raspberry Pi 5, hands). Verify every action-group name against ActionGroups/ on your robot.

[body]
name = "tonypi_pro"
sdk_path = "/home/pi/TonyPi/HiwonderSDK"
action_path = "/home/pi/TonyPi/ActionGroups/"
turn_step_deg = 15.0

[actions]
stand = "stand"
forward = "go_forward_one_step"
turn_left = "turn_left"
turn_right = "turn_right"
grab = "hand_close"
release = "hand_open"
kick_left = "left_shot"
kick_right = "right_shot"
wave = "wave"
stand_up_front = "stand_up_front"
stand_up_back = "stand_up_back"

[camera]
enabled = true
device = 0
width = 640
height = 480
hfov_deg = 62.0

[imu]
enabled = true
bus = 1
address = "0x68"
fall_deg = 55.0
forward_sign = 1

[roam]
step_m = 0.05
cell_m = 0.05
progress_ratio = 0.4
sample_gap_s = 0.12
max_steps = 40
max_bumps = 15
turn_min_deg = 60.0
turn_max_deg = 150.0
fall_forward_deg = 15.0
fall_back_deg = 160.0
wifi_iface = "wlan0"
wifi_n = 2.5

[speech]
language = "en"
asr_model = "base.en"
tts_voice = "en-us"

[brain]
name = "qwen_vl"
base_url = "http://192.168.1.50:8000/v1"   # vLLM on a desktop GPU, not on the Pi
model = "Qwen/Qwen2.5-VL-7B-Instruct"

[trace]
root = "traces"
sinks = ["local"]
