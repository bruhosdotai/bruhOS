name: contributor points

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["contrib/**", ".github/workflows/contrib-points.yml"]

permissions:
  contents: write

concurrency:
  group: contrib-points
  cancel-in-progress: false

jobs:
  points:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Compute points
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: mkdir -p out && python contrib/score.py --repo "$REPO" --out out/points.json

      - name: Publish to the scores branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cd out
          git init -q -b scores
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add points.json
          git commit -qm "points $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" scores
