[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bruhos"
version = "0.1.0.dev0"
description = "The skill OS that stands next to the robot."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "BruhOS", email = "bruhos2027@gmail.com" }]
keywords = ["robotics", "embodied-ai", "tonypi", "lerobot", "vlm", "skills"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.8", "numpy>=1.24"]
ground = [
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "ultralytics>=8.1",
  "pillow>=10",
]
florence = [
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "pillow>=10",
  "torch",
  "transformers>=4.40",
  "einops",
  "timm",
]
# Install CPU torch on Pi (avoid CUDA wheels filling the disk):
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
#   pip install 'bruhos[depth]'
depth = [
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "torch",
  "torchvision",
]
imu = ["smbus2>=0.4"]
speech = ["faster-whisper>=1.0"]
ear = ["pyserial>=3.5"]
dev = ["pytest>=8"]

[project.scripts]
bruhos = "bruhos.cli:main"

[project.urls]
Homepage = "https://bruhos.ai"
X = "https://x.com/bruhos_ai"

[tool.setuptools.packages.find]
include = ["bruhos*"]

[tool.setuptools.package-data]
bruhos = ["eval/*.toml", "sim/*.toml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
