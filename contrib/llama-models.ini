# Per-model args for the llama-server router. The section name is the folder
# under /var/lib/bruhos/models. qwen3-asr keeps the template in its GGUF:
# its answer format is "language …<asr_text>" plus the words, and the ear
# parses that. A fixed English prefill here would ignore the configured language.

[tinyllama]
chat-template-file = /root/Sites/bruhOS/contrib/templates/tinyllama.jinja
