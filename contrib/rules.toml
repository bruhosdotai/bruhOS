# bruhOS contributor points — the rules behind the 5% contributor pool.
# Human-readable version: CONTRIBUTING.md. Changes to this file go through a public PR.

[pool]
supply_pct = 5.0          # share of total token supply reserved for contributors
min_points = 20.0         # below this, a contributor is not eligible
max_share = 0.15          # one contributor gets at most 15% of the pool; applies only with
                          # 7+ eligible, otherwise pure proportional, so the whole pool is always distributed
# Points earned after this moment are not counted. Set ~30 days before TGE.
snapshot_at = ""          # e.g. "2026-11-30T00:00:00Z"

[repo]
branch = "main"
# Core team members are paid from the team allocation, not from this pool.
team = ["bruhosdotai"]

[points]
merged_pr = 10.0          # merged PR without a special label
# Merged PR with one of these labels; the highest-paying label wins.
labels = { core = 20.0, security = 20.0, docs = 3.0, chore = 3.0 }
spam = -20.0              # PR or issue labelled spam; also disqualifies
# bounty:N on a merged PR adds N points.

[caps]
daily_points = 60.0       # positive points per contributor per UTC day; bounties are exempt
