# bruhOS contributor points — the rules behind the 5% contributor pool.
# Human-readable version: CONTRIBUTING.md. Changes to this file go through a public PR.

[pool]
supply_pct = 5.0          # share of total token supply reserved for contributors
min_points = 20.0         # below this, a contributor is not eligible
max_share = 0.15          # one contributor gets at most 15% of the pool
# Points earned after this moment are not counted. Set ~30 days before TGE.
snapshot_at = ""          # e.g. "2026-11-30T00:00:00Z"

[repo]
branch = "main"
# Core team members are paid from the team allocation, not from this pool.
team = ["bruhosdotai"]
# Not counted toward lines changed.
exclude_paths = [
  "*.lock", "uv.lock", "poetry.lock", "package-lock.json", "bun.lock",
  "*.png", "*.jpg", "*.jpeg", "*.gif", "*.webp", "*.mp4", "*.pdf",
  "*.parquet", "*.npz", "*.bin", "*.safetensors",
  "traces/*", "contrib/wallets/*",
]

[merged_pr]
base = 10.0
# Lines changed (additions + deletions, excluded paths removed) -> multiplier.
size = [
  { max_lines = 10,  mult = 0.3 },
  { max_lines = 50,  mult = 0.7 },
  { max_lines = 150, mult = 1.0 },
  { max_lines = 500, mult = 1.5 },
  { max_lines = -1,  mult = 2.0 },   # -1 = no upper bound
]
# PR label -> multiplier. Highest matching label wins; labels do not stack.
labels = { security = 2.0, core = 1.5, skill = 1.3, body = 1.3, feature = 1.2, test = 1.0, docs = 0.6, chore = 0.3 }
default_label_mult = 1.0

[other]
review = 2.0              # approve / request-changes on someone else's PR that gets merged
review_weekly_cap = 10.0
confirmed_bug = 3.0       # issue labelled confirmed-bug
hardware_verified = 15.0  # PR or issue labelled hardware-verified (run on a real robot, video/log attached)
spam = -20.0              # PR or issue labelled spam; also disqualifies

[caps]
daily_points = 60.0       # positive points per contributor per UTC day; bounties are exempt
